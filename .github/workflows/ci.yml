name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Dependabot bumps version floors in pyproject.toml without re-locking, which can
    # leave uv.lock pinned below its own declared minimums. Nothing else catches that:
    # the install steps resolve fresh rather than installing from the lock.
    - name: Verify uv.lock is in sync with pyproject.toml
      run: uv lock --check

    # The lint tools come from the dev dependency group in uv.lock, so `uv run`
    # provides them. Do not add `uv pip install <tool>` here: `uv run` re-syncs the
    # project environment from the lock before running, discarding anything
    # installed ad-hoc -- the same unsoundness documented on the build job below.
    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Lint with black
      run: |
        uv run black --check src tests

    - name: Check import sorting with isort
      run: |
        uv run isort --check-only --profile black src tests

    - name: Lint with ruff
      run: |
        uv run ruff check src tests

    - name: Security check with bandit
      run: |
        uv run bandit -r src -ll --skip B101

    - name: Type check with mypy
      run: |
        uv run mypy src --ignore-missing-imports --no-strict-optional || true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Install dependencies
      run: |
        uv venv
        uv pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        uv run pytest -v --tb=short
      env:
        CALENDAR_WEATHER_LATITUDE: "40.7128"
        CALENDAR_WEATHER_LONGITUDE: "-74.0060"
        CALENDAR_TIMEZONE: "America/New_York"

    # pytest-cov is in the dev dependency group, so uv.lock supplies it -- see the
    # note on the lint job. It used to be installed here with `uv pip install`,
    # which `uv run` discarded on its re-sync, so `--cov` was an unrecognised
    # argument and this step failed on every run. `continue-on-error` hid that,
    # coverage.xml was never written, and the upload below had nothing to send.
    # Left gating for that reason: if coverage tooling breaks again, CI should say
    # so rather than silently stop reporting.
    #
    # Same env as the test step above -- this re-runs the same suite.
    - name: Generate test coverage report
      run: |
        uv run pytest --cov=src --cov-report=xml --cov-report=term-missing
      env:
        CALENDAR_WEATHER_LATITUDE: "40.7128"
        CALENDAR_WEATHER_LONGITUDE: "-74.0060"
        CALENDAR_TIMEZONE: "America/New_York"

    # `files:` (plural). v7 of this action dropped the singular `file:`, which was
    # reported as `Unexpected input(s) 'file'` on every run and ignored -- so the
    # action fell back to searching for reports itself.
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.14'

    - name: Install uv
      uses: astral-sh/setup-uv@v7

    # Run the build tooling through uvx so each tool resolves its own dependencies
    # in an isolated environment. `uv pip install X` followed by `uv run X` is
    # unsound: `uv run` re-syncs the project environment from uv.lock first, which
    # downgrades or removes anything installed ad-hoc. That is how twine 7.0.0 broke
    # this job -- it needs packaging>=26.1, but `uv run` reset packaging to the
    # locked 26.0, so twine failed on `from packaging import errors`.
    - name: Build package
      run: uvx --from build pyproject-build

    - name: Check package
      run: uvx twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/
