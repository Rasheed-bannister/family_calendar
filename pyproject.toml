[project]
name = "calendar"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "werkzeug>=3.1.8",
    "google-api-core>=2.32.0",
    "google-api-python-client>=2.198.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "numpy>=2.4.6",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.0.5",
    "requests-cache>=1.3.3",
    "retry-requests>=2.0.0",
    "gpiozero>=2.0.1; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "lgpio>=0.2.2.0; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "psutil>=7.2.2",
    "Pillow>=12.3.0",
    "qrcode[pil]>=8.2",
    "pillow-heif>=1.5.0",
]

[dependency-groups]
dev = [
    # Testing
    "pytest>=9.1.1",

    # Code formatting
    "black>=26.5.1",
    "isort>=8.0.1",

    # Linting and static analysis
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "bandit>=1.9.4",

    # Code quality and complexity analysis
    "radon>=6.0.1",
    "vulture>=2.16",
    "autoflake>=2.3.3",

    # Security scanning
    "pip-audit>=2.10.1",

    # Pre-commit hooks
    "pre-commit>=4.6.2",
]

[tool.uv]
# Force patched versions of transitive dependencies to resolve security advisories:
# - pyasn1 (via google-auth): unbounded recursion DoS CVE, plus quadratic OID /
#   long-form tag parsing and float-precision Real decoding (<0.6.4)
# - cryptography (via google-auth-oauthlib): vulnerable OpenSSL bundled in wheels
#   (<48.0.1), plus Bleichenbacher oracle in PKCS#7 decryption via distinguishable
#   RecipientInfo failure modes CVE-2026-69247 (<50.0.0)
# - msgpack (via requests-cache): out-of-bounds read / crash on Unpacker reuse (<=1.2.0)
# - pip (via pip-audit -> pip-api): path traversal via entry point names (<26.1.2)
# - click (via black/flask): command injection in click.edit() (<8.3.3); not
#   reachable from this codebase, constrained to keep pip-audit clean
# - httplib2 (via google-auth-httplib2): unbounded decompression of gzip/deflate
#   response bodies -> memory exhaustion / OOM DoS PYSEC-2026-3444 (<0.32.0)
# - setuptools (build backend, pulled in at runtime by colorzero): MANIFEST.in
#   exclusion bypass in sdist via Unicode NFC/NFD collision CVE-2026-59890
#   (<83.0.0)
constraint-dependencies = [
    "pyasn1>=0.6.4",
    "cryptography>=50.0.0",
    "msgpack>=1.2.1",
    "pip>=26.1.2",
    "click>=8.3.3",
    "httplib2>=0.32.0",
    "setuptools>=83.0.0",
]

[tool.black]
# Target Python 3.11+ to avoid 3.14-only syntax (e.g. unparenthesized
# multi-exception except clauses) since the deploy script supports 3.11+.
target-version = ["py311"]

[tool.ruff.lint]
# Pin the rule selection explicitly. This project had never set `select`, so it
# was silently inheriting whatever ruff happened to default to -- and ruff 0.16
# expanded that default from 59 rules to 413, turning a routine version bump
# into 396 new violations across rule families nobody had opted into.
#
# These four codes are exactly the pre-0.16 default, so CI enforces the same
# rules before and after the upgrade. Adopting the newer families (UP, SIM, DTZ,
# BLE, LOG, ...) is a worthwhile but separate decision -- `ruff check src tests
# --select <FAMILY> --statistics` shows what each would flag.
select = ["E4", "E7", "E9", "F"]

# RSE102 removes parentheses from multi-exception except clauses,
# turning valid `except (A, B):` into invalid `except A, B:` syntax.
# Not currently reachable via `select` above, but kept so the rule stays
# disabled if the selection is ever widened.
ignore = ["RSE102"]

[tool.pytest.ini_options]
pythonpath = [
  "."
]
